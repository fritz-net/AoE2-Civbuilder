name: Generate Card Images

on:
  push:
    paths:
      - 'scripts/boni-card-specs.json'
  pull_request:
    paths:
      - 'scripts/boni-card-specs.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Node.js dependencies
        run: npm ci

      - name: Generate PNG card images
        run: node scripts/generate-cards.js

      - name: Convert new PNGs to compressed JPGs
        run: |
          sudo apt-get install -y --no-install-recommends imagemagick
          for f in public/img/cards/*.png; do
            base=$(basename "$f" .png)
            jpg="public/img/compressedcards/${base}_v0.jpg"
            if [ ! -f "$jpg" ]; then
              convert "$f" -quality 85 "$jpg"
              echo "Compressed: $jpg"
            fi
          done

      - name: Commit generated images
        if: github.event_name == 'push'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add public/img/cards/ public/img/compressedcards/
          git diff --staged --quiet || git commit -m "chore: regenerate card images from boni-card-specs.json"
          git push

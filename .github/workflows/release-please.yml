name: Release Please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write
  packages: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          release-type: simple
          token: ${{ secrets.GITHUB_TOKEN }}

  build-docker:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created && needs.release-please.outputs.tag_name }}
    uses: ./.github/workflows/ghcr-build.yml
    permissions:
      contents: read
      packages: write
    with:
      tag_name: ${{ needs.release-please.outputs.tag_name }}

  update-release:
    needs: [release-please, build-docker]
    if: ${{ needs.release-please.outputs.release_created && needs.release-please.outputs.tag_name }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Update release with Docker image info
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="${{ needs.release-please.outputs.tag_name }}"
          DOCKER_IMAGE="ghcr.io/fritz-net/aoe2-civbuilder:${TAG_NAME}"
          
          # Get current release body
          CURRENT_BODY=$(gh api repos/${{ github.repository }}/releases/tags/${TAG_NAME} --jq '.body')
          
          # Append Docker image info to release body
          NEW_BODY="${CURRENT_BODY}

          ---

          ## Docker Image

          \`\`\`bash
          docker pull ${DOCKER_IMAGE}
          \`\`\`

          Or use the latest tag:
          \`\`\`bash
          docker pull ghcr.io/fritz-net/aoe2-civbuilder:latest
          \`\`\`"
          
          # Update the release
          gh api repos/${{ github.repository }}/releases/tags/${TAG_NAME} \
            --method PATCH \
            --field body="${NEW_BODY}"

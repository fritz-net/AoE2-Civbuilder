name: Build and publish Docker image
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  simple-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Run Simple E2E tests
        run: npm run test:simple
        env:
          CI: true

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: simple-test-results
          path: |
            test-results/
            coverage/
          retention-days: 7

  build-for-testing:
    runs-on: ubuntu-latest
    needs: simple-tests  # Build only if simple tests pass
    outputs:
      image-digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout repository (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: 0

      - name: Set up QEMU and Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image for testing
        id: build
        uses: docker/build-push-action@v4
        with:
          context: .
          file: Dockerfile.build-cpp
          platforms: linux/amd64
          push: true
          tags: ghcr.io/fritz-net/aoe2-civbuilder:test-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  complex-tests:
    runs-on: ubuntu-latest
    needs: build-for-testing  # Run complex tests with the freshly built image
    services:
      # Run the C++ backend as a Docker service using the current code
      civbuilder-backend:
        image: ghcr.io/fritz-net/aoe2-civbuilder:test-${{ github.sha }}
        ports:
          - 4000:4000
        env:
          CIVBUILDER_HOSTNAME: http://localhost:4000
        # Simplified health check - just check if port is responding
        options: --health-cmd="curl -f http://localhost:4000/ || exit 1"
                 --health-interval=10s --health-timeout=5s --health-retries=10 --health-start-period=30s
    
    steps:
      - name: Checkout repository (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      
      - name: Debug - Check network connectivity
        run: |
          echo "=== Network diagnostics ==="
          echo "Checking if port 4000 is listening..."
          netstat -tuln | grep 4000 || echo "Port 4000 not found in netstat"
          echo ""
          echo "Attempting direct connection test..."
          nc -zv localhost 4000 || echo "Netcat connection failed"
          echo ""
          echo "DNS resolution check..."
          ping -c 1 localhost || echo "Localhost ping failed"
      
      - name: Check for container crashes
        run: |
          echo "=== Checking for container crashes ==="
          # Wait a moment for container to potentially crash
          sleep 5
          
          # Find the container
          CONTAINER_ID=$(docker ps -aq --filter "ancestor=ghcr.io/fritz-net/aoe2-civbuilder:test-${{ github.sha }}" 2>/dev/null | head -1)
          
          if [ -z "$CONTAINER_ID" ]; then
            echo "ERROR: Container not found!"
            docker ps -a
            exit 1
          fi
          
          # Check if container is running or exited
          CONTAINER_STATUS=$(docker inspect --format='{{.State.Status}}' $CONTAINER_ID 2>/dev/null || echo "unknown")
          echo "Container ID: $CONTAINER_ID"
          echo "Container Status: $CONTAINER_STATUS"
          
          if [ "$CONTAINER_STATUS" = "exited" ] || [ "$CONTAINER_STATUS" = "dead" ]; then
            echo ""
            echo "ERROR: Container has crashed or exited!"
            echo ""
            echo "Exit Code:"
            docker inspect --format='{{.State.ExitCode}}' $CONTAINER_ID
            echo ""
            echo "Container logs:"
            docker logs $CONTAINER_ID 2>&1
            exit 1
          elif [ "$CONTAINER_STATUS" = "restarting" ]; then
            echo "WARNING: Container is restarting repeatedly!"
            echo ""
            echo "Container logs:"
            docker logs $CONTAINER_ID 2>&1 | tail -100
          else
            echo "Container is running (status: $CONTAINER_STATUS)"
            echo ""
            echo "Recent logs:"
            docker logs --tail 20 $CONTAINER_ID 2>&1
          fi

      - name: Wait for C++ backend service
        run: |
          echo "Waiting for C++ backend service to be ready..."
          echo "Testing connection to http://localhost:4000/"
          
          # Show all containers
          echo "=== Docker containers ==="
          docker ps -a
          
          # Try to find and show logs of the civbuilder service
          echo ""
          echo "=== Checking service container logs ==="
          CONTAINER_ID=$(docker ps -q --filter "ancestor=ghcr.io/fritz-net/aoe2-civbuilder:test-${{ github.sha }}" 2>/dev/null || echo "")
          if [ -n "$CONTAINER_ID" ]; then
            echo "Found container: $CONTAINER_ID"
            echo "Container logs (last 50 lines):"
            docker logs --tail 50 $CONTAINER_ID 2>&1 || echo "Could not retrieve logs"
          else
            echo "Container not found by ancestor, trying by name..."
            docker logs civbuilder-backend 2>&1 | head -50 || echo "Could not find container by name either"
          fi
          
          echo ""
          echo "=== Testing connectivity ==="
          # Optimized wait: try every 2 seconds for up to 60 seconds (30 attempts)
          for i in {1..30}; do
            if curl -f http://localhost:4000/ > /dev/null 2>&1; then
              echo "✓ Service is ready on attempt $i!"
              echo ""
              echo "=== Service response ==="
              curl -v http://localhost:4000/ 2>&1 | head -20
              exit 0
            fi
            echo "Attempt $i/30: Service not ready yet, waiting 2 seconds..."
            
            # Show container status every 10 attempts
            if [ $((i % 10)) -eq 0 ]; then
              echo "  Container status:"
              docker ps -a --filter "ancestor=ghcr.io/fritz-net/aoe2-civbuilder:test-${{ github.sha }}" --format "table {{.ID}}\t{{.Status}}\t{{.Ports}}" 2>/dev/null || echo "  (Could not get container status)"
            fi
            
            sleep 2
          done
          
          echo ""
          echo "ERROR: Service did not start in time after 60 seconds"
          echo ""
          echo "=== Final container status ==="
          docker ps -a
          echo ""
          echo "=== Final service logs ==="
          if [ -n "$CONTAINER_ID" ]; then
            docker logs $CONTAINER_ID 2>&1 | tail -100
          else
            docker logs civbuilder-backend 2>&1 | tail -100 || echo "Could not retrieve logs"
          fi
          exit 1

      - name: Run Complex E2E tests with C++ Backend
        run: npm run test:complex
        env:
          CI: true
          CIVBUILDER_HOSTNAME: http://localhost:4000

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: complex-test-results
          path: |
            test-results/
            coverage/
          retention-days: 7

  build:
    runs-on: ubuntu-latest
    needs: [simple-tests, complex-tests]  # Only build if both test jobs pass
    steps:
      - name: Checkout repository (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: 0

      - name: Set up QEMU and Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: Dockerfile.build-cpp
          platforms: linux/amd64
          push: ${{ github.event_name == 'push' }}
          tags: ghcr.io/fritz-net/aoe2-civbuilder:latest,
                ghcr.io/fritz-net/aoe2-civbuilder:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
